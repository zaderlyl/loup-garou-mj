<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Panel MJ — Loup-Garou de Thiercelieux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="game-frame">
    <header>
      <h1>🐺 Panel MJ</h1>
      <p>Loup-Garou de Thiercelieux</p>
    </header>

    <div class="top-actions">
      <a href="index.html" class="btn ghost small">🏠 Accueil</a>
      <a href="hub.html" class="btn small">⚙️ Paramètres</a>
      <button id="reset-game" class="btn danger small">🔄 Nouvelle partie</button>
    </div>

    <div id="game-status-bar"></div>
    <div id="stat-bar"></div>
    <div id="phase-banner"></div>

    <form id="add-player-form">
      <input id="new-player-name" type="text" placeholder="Nom du joueur" autocomplete="off" required>
      <button type="submit" class="btn primary">Ajouter</button>
    </form>

    <div id="side-panels"></div>

    <div id="players"></div>
  </div>

  <div id="player-detail-overlay" class="role-detail-overlay" hidden>
    <div class="role-detail-card" style="--team-color:transparent">
      <button type="button" id="player-detail-close" class="btn small ghost role-detail-close">✕</button>
      <div id="player-detail-body"></div>
    </div>
  </div>

  <script src="roles.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
